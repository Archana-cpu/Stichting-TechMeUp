  <path d="M20 24C20 24 20 16 20 10" stroke="url(#treeGradientLight)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Leaves/Nodes - life moments -->
  <circle cx="8" cy="12" r="4" fill="#7C3AED" opacity="0.9"/>
  <circle cx="20" cy="6" r="5" fill="#8B5CF6"/>
  <circle cx="32" cy="12" r="4" fill="#7C3AED" opacity="0.9"/>
  <!-- Small accent nodes -->
  <circle cx="14" cy="18" r="2.5" fill="#A78BFA" opacity="0.7"/>
  <circle cx="26" cy="18" r="2.5" fill="#A78BFA" opacity="0.7"/>
