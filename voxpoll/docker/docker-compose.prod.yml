# ══════════════════════════════════════════════════════════════════════════════
# VOXPOLL - PRODUCTION DOCKER COMPOSE (AWS EC2/ECS Deployment)
# ══════════════════════════════════════════════════════════════════════════════
# Infrastructure: AWS RDS (PostgreSQL), AWS ElastiCache (Redis), AWS S3
# Can also be used with self-managed PostgreSQL and Redis containers
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # API Server
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    container_name: voxpoll-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PARTICIPANT_HASH_SALT: ${PARTICIPANT_HASH_SALT}
      FRAUD_DETECTION_SALT: ${FRAUD_DETECTION_SALT}
      # Google OAuth
      GOOGLE_CLIENT_ID_WEB: ${GOOGLE_CLIENT_ID_WEB}
      GOOGLE_CLIENT_SECRET_WEB: ${GOOGLE_CLIENT_SECRET_WEB}
      GOOGLE_CLIENT_ID_PLATFORM: ${GOOGLE_CLIENT_ID_PLATFORM}
      GOOGLE_CLIENT_SECRET_PLATFORM: ${GOOGLE_CLIENT_SECRET_PLATFORM}
      GOOGLE_CLIENT_ID_MOBILE: ${GOOGLE_CLIENT_ID_MOBILE}
      # Apple OAuth
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ─────────────────────────────────────────────────────────────────────────────
  # Web Application (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    container_name: voxpoll-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ─────────────────────────────────────────────────────────────────────────────
  # Platform Admin (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: platform
    container_name: voxpoll-platform
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_PLATFORM_URL}
    ports:
      - "${PLATFORM_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database (Self-Hosted Option)
  # Skip if using AWS RDS
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: voxpoll-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    profiles:
      - self-hosted-db

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis Cache (Self-Hosted Option)
  # Skip if using AWS ElastiCache
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voxpoll-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    profiles:
      - self-hosted-cache

volumes:
  postgres_prod_data:
    name: voxpoll_postgres_prod_data
  redis_prod_data:
    name: voxpoll_redis_prod_data

networks:
  default:
    name: voxpoll_prod_network
